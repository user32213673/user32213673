name: Grad-Deploy CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-nginx-svc:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push nginx-svc
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.nginx-svc
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nginx-service-v2:latest
            ghcr.io/${{ github.repository_owner }}/nginx-service-v2:${{ github.sha }}
          cache-from: type=gha,scope=nginx-svc
          cache-to: type=gha,mode=max,scope=nginx-svc

  build-spring-svc:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push spring-svc
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.spring-svc
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/spring-service-v2:latest
            ghcr.io/${{ github.repository_owner }}/spring-service-v2:${{ github.sha }}
          cache-from: type=gha,scope=spring-svc
          cache-to: type=gha,mode=max,scope=spring-svc

  update-manifests:
    needs: [build-nginx-svc, build-spring-svc]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for plain text Secrets
        run: |
          if grep -r "^kind: Secret" k8s/ --include="*.yaml" 2>/dev/null | grep -v "SealedSecret"; then
            echo "::error::평문 Secret이 발견되었습니다. SealedSecret을 사용하세요."
            exit 1
          fi
          echo "✅ 평문 Secret 없음"

      - name: Update image tags in kustomization
        run: |
          cd k8s/overlays/production
          sed -i "s|newTag: .*|newTag: ${{ github.sha }}|g" kustomization.yaml || true
          cd k8s/overlays/production
          sed -i "s|newTag: .*|newTag: ${{ github.sha }}|g" kustomization.yaml || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/production/kustomization.yaml
          git diff --staged --quiet || git commit -m "ci: update image tags [${{ github.sha }}]"
          git push

      - name: Trigger Argo CD Sync
        env:
          ARGOCD_SERVER: ${{ vars.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/sync_resp.json -w "%{http_code}" \
            -X POST "https://${ARGOCD_SERVER}/api/v1/applications/my-app/sync" \
            -H "Authorization: Bearer ${ARGOCD_AUTH_TOKEN}" \
            -H "Content-Type: application/json" \
            --insecure \
            -d '{"prune":true,"strategy":{"hook":{"force":false}},"syncOptions":["CreateNamespace=true"]}')
          echo "Argo CD Sync HTTP Status: ${HTTP_STATUS}"
          if [ "${HTTP_STATUS}" = "401" ]; then
            echo "::error::ARGOCD_TOKEN 만료. Settings → Accounts → admin → Generate New Token"
            exit 1
          elif [ "${HTTP_STATUS}" = "404" ]; then
            echo "::error::앱 'my-app'이 없음. kubectl apply -f k8s/argo-app.yaml -n argocd 필요"
            exit 1
          fi